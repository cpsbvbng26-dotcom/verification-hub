# GitHub Actions の版の更新を知らせる。GitHub の無料の機能で、PR を開くだけ。
# 外のアクションはコミットの値で固め、版を注釈に書く。Dependabot が上げるときも、この形のまま上げる。
# その PR は、共通の検査（self-test.yml）が通ってからマージする。shared-check.yml の値が変われば、templates/hub.yml の値も上げる。
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
