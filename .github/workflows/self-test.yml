name: 共通の検査
# このリポジトリ自身を、共通の検査（shared-check.yml）で確かめる。同じコミットのファイルを ./ で呼ぶ。
# 目録の置き方で動き、このリポジトリの検査（verification/check.js）と、目録のすべてのリポジトリの横断の検査を回す。
# 週に一度も回す。目録の手順と、各リポジトリの CI のワークフローとのずれは、このリポジトリに変更が無い日にも起きる。
# 同時実行の組は、この仕事に置く。同じ PR の新しい push は古い実行を取り消し、main の実行は取り消さない。
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '43 5 * * 2'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shared:
    name: 共通の検査
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    uses: ./.github/workflows/shared-check.yml
