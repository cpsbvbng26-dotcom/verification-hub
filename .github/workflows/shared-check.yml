name: shared-check
# 共通の検査。変更のたびに、呼んだリポジトリで回す再利用のワークフローである（on: workflow_call）。
# 呼ぶ側は、このファイルをコミットの値で固めて呼ぶ。入力も鍵も受け取らない。
#
# 道具と目録は、このファイルと同じコミットから読む（job.workflow_repository と job.workflow_sha）。
# 呼ぶ側が固めたコミットの道具だけが動き、置き場の main が動いても、呼ぶ側の検査は変わらない。
# 置き場に repos.json と tools/ があれば、目録の置き方で動く。目録には、読むリポジトリと、各リポジトリの検査の手順がある。
# 無ければ、写しの置き方で動く。このファイルの写しを持つリポジトリが、自分の .github/shared-check/ の道具と repo.json で、自分だけを検査する。
# このファイルと道具には、どのリポジトリの名も書かない。名は目録にだけある。
#
# 仕事は三つ。
#   plan    目録を読み、呼んだリポジトリの検査の仕事を並べる。
#   own     呼んだリポジトリの CI の検査を、目録の手順のとおりに一つずつ回す（仕事ごとに matrix の一つ）。
#   common  目録の置き方では、目録のすべてのリポジトリを読むだけの複製として並べ、横断の検査を回す。
#           どちらの置き方でも、写しの一致・メールアドレスと壊れた活用の走査・ファイルのつながりを見る。
#
# 守り：権限は contents: read だけ。鍵を読まない。外のアクションはコミットの値で固める。どの仕事にも時間の上限がある。
# checkout は鍵を残さない。run の行に式（${{ }}）を書かない（値は env を通して渡す）。
# pull_request_target と workflow_run では起こさない。呼ぶ側の同時実行の組は、呼ぶ側の仕事に置く。
on:
  workflow_call:
permissions:
  contents: read
jobs:
  plan:
    name: 目録を読む
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      name: ${{ steps.plan.outputs.name }}
      jobs: ${{ steps.plan.outputs.jobs }}
      common: ${{ steps.plan.outputs.common }}
      entrance: ${{ steps.plan.outputs.entrance }}
      requirements: ${{ steps.plan.outputs.requirements }}
    steps:
      - name: このワークフローの置き場とコミットを確かめる
        env:
          SOURCE_REPOSITORY: ${{ job.workflow_repository }}
          SOURCE_SHA: ${{ job.workflow_sha }}
        run: |
          [[ "$SOURCE_REPOSITORY" =~ ^[A-Za-z0-9-]+/[A-Za-z0-9._-]+$ ]] || { echo 'job.workflow_repository を読めない'; exit 1; }
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'job.workflow_sha を読めない'; exit 1; }
          echo "このワークフローの置き場：$SOURCE_REPOSITORY @ $SOURCE_SHA"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - id: plan
        name: 呼んだリポジトリの欄を読む
        run: |
          if [ -f source/repos.json ] && [ -f source/tools/plan.js ]; then tools=source/tools; else tools=source/.github/shared-check; fi
          node "$tools/plan.js"

  own:
    name: ${{ matrix.job.id }}
    needs: plan
    if: needs.plan.outputs.jobs != '[]'
    strategy:
      fail-fast: false
      matrix:
        job: ${{ fromJSON(needs.plan.outputs.jobs) }}
    runs-on: ${{ matrix.job.runner }}
    timeout-minutes: 60
    steps:
      - name: このワークフローの置き場とコミットを確かめる
        env:
          SOURCE_REPOSITORY: ${{ job.workflow_repository }}
          SOURCE_SHA: ${{ job.workflow_sha }}
        run: |
          [[ "$SOURCE_REPOSITORY" =~ ^[A-Za-z0-9-]+/[A-Za-z0-9._-]+$ ]] || { echo 'job.workflow_repository を読めない'; exit 1; }
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'job.workflow_sha を読めない'; exit 1; }
      # 呼んだリポジトリ。PR では、マージの試しのコミットではなく、PR の先のコミットを取る（横断の検査がマージの本文を数えるため）。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: ${{ matrix.job.fetch-depth }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .shared-check-source
          persist-credentials: false
      # 道具の置き場を、検査するリポジトリの外へ移す。リポジトリの検査が、道具のファイルまで走らないように。
      - name: 道具の置き場を外へ移す
        run: mv .shared-check-source "$RUNNER_TEMP/shared-check-source"
      - if: matrix.job.python != ''
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.job.python }}
      - if: matrix.job.node != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.job.node }}
      - name: このリポジトリの検査を、目録の手順のとおりに回す
        env:
          OWN_JOB: ${{ matrix.job.id }}
        run: |
          src="$RUNNER_TEMP/shared-check-source"
          if [ -f "$src/repos.json" ] && [ -f "$src/tools/own.js" ]; then tools="$src/tools"; else tools="$src/.github/shared-check"; fi
          node "$tools/own.js" "$OWN_JOB"

  common:
    name: 横断の検査と、どのリポジトリにも同じ物差し
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: このワークフローの置き場とコミットを確かめる
        env:
          SOURCE_REPOSITORY: ${{ job.workflow_repository }}
          SOURCE_SHA: ${{ job.workflow_sha }}
        run: |
          [[ "$SOURCE_REPOSITORY" =~ ^[A-Za-z0-9-]+/[A-Za-z0-9._-]+$ ]] || { echo 'job.workflow_repository を読めない'; exit 1; }
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'job.workflow_sha を読めない'; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: source
          persist-credentials: false
      # 呼んだリポジトリは、ほかのリポジトリと同じ並びに、履歴ごと置く。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: repos/${{ needs.plan.outputs.name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - if: needs.plan.outputs.common == 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      # 目録のほかのリポジトリを、鍵を使わずに複製する（公開のリポジトリを https で読むだけ）。
      - if: needs.plan.outputs.common == 'true'
        name: 目録のほかのリポジトリを並べる
        run: node source/tools/siblings.js repos
      # 横断の検査が使う道具は、正本を持つリポジトリの、版とハッシュを固めた一覧からだけ入れる。
      - if: needs.plan.outputs.common == 'true'
        name: 横断の検査の道具を入れる
        env:
          REQUIREMENTS: ${{ needs.plan.outputs.requirements }}
        run: pip install --require-hashes --only-binary=:all: -r "$REQUIREMENTS"
      - if: needs.plan.outputs.common == 'true'
        name: 各リポジトリの検査を全部
        working-directory: repos/${{ needs.plan.outputs.entrance }}
        run: node verification/check_all.js
      # 各リポジトリの検査が落ちても、横断のずれは見る。
      - if: needs.plan.outputs.common == 'true' && !cancelled()
        name: 横断のずれ
        working-directory: repos/${{ needs.plan.outputs.entrance }}
        run: node verification/check_ecosystem.js
      - if: '!cancelled()'
        name: 写し・メールアドレスと壊れた活用の走査・ファイルのつながり
        run: |
          if [ -f source/repos.json ] && [ -f source/tools/common.js ]; then tools=source/tools; else tools=source/.github/shared-check; fi
          node "$tools/common.js" repos
