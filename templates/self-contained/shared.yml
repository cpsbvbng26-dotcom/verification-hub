name: 共通の検査
# 共通の検査（shared-check.yml）の写しを、このリポジトリの中で呼ぶ。写しの置き方で動き、このリポジトリだけを検査する。
# 道具は .github/shared-check/ にあり、手順は同じ場所の repo.json にある。どちらも写しで、ここでは直さない。
# 同時実行の組は、この仕事に置く。PR では組が PR ごとに一つで、新しい実行が、走っている実行と待っている実行を取り消す。
# PR のほか（main への push・定期・手で起こすとき）は、実行ごとに組が分かれるので、どの実行も取り消されない
# （GitHub は、同じ組で待っている実行を、cancel-in-progress が false でも新しい実行で取り消す）。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shared:
    name: 共通の検査
    concurrency:
      group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    uses: ./.github/workflows/shared-check.yml
